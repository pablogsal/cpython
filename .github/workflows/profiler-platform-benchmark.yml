name: Profiler Intel repeated controls
on:
  push:
    branches: [bench-profiler-intel-repeat-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-repeat:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 2c2d8018a20da33c749f42cc6a4ae55664a88321
          path: baseline
          persist-credentials: false
      - name: Build both revisions with matching flags
        shell: bash
        run: |
          ./configure --without-ensurepip > candidate-configure.log 2>&1
          make -j4 > candidate-build.log 2>&1
          cd baseline
          ./configure --without-ensurepip > ../baseline-configure.log 2>&1
          make -j4 > ../baseline-build.log 2>&1
      - name: Repeat with baseline controls
        shell: bash
        run: |
          sudo -n python3 Tools/profiler_platform_bench/repeat_case.py compare "$PWD/baseline/python.exe" "$PWD/python.exe" | tee repeated-results.jsonl
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: intel-repeated-controls
          path: |
            repeated-results.jsonl
            *-build.log
            *-configure.log
